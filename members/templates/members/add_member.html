{% extends 'members/base.html' %}
{% block content %}

<p class="page-title">メンバーを登録</p>
<p class="page-sub">名前・最寄り駅・車の有無を入力してください</p>

<div class="card">
    <form method="POST" action="{% url 'add_member' %}">
        {% csrf_token %}
        <label for="name">名前</label>
        <input type="text" name="name" required>

        <label for="nearest_station">最寄り駅</label>
        <input type="text" name="nearest_station" required>

        <label>車の有無</label>
        <div class="checkbox-row">
            <label><input type="checkbox" name="has_car" value="true"> 車を出せる</label>
        </div>

        <label for="car_capacity">乗車定員（運転手を含む）</label>
        <input type="text" name="car_capacity">

        <button type="submit" class="btn">登録する</button>
    </form>
</div>

{% endblock %}
