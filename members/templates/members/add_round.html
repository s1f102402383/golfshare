{% extends 'members/base.html' %}
{% block content %}

<p class="page-title">おでかけを作成</p>
<p class="page-sub">日付・参加メンバー・集合場所を設定します</p>

<div class="card">
    <form method="POST" action="{% url 'add_round' %}">
        {% csrf_token %}
        <label for="day">日付</label>
        <input type="date" name="day" required>

        <label>参加メンバー</label>
        <div class="checkbox-row">
            {% for member in members %}
            <label><input type="checkbox" name="members" value="{{ member.id }}"> {{ member.name }}</label>
            {% endfor %}
        </div>

        <label for="gather_station">集合する駅</label>
        <input type="text" name="gather_station" required>

        <label for="gather_time">集合時間</label>
        <input type="time" name="gather_time" required>

        <button type="submit" class="btn">作成する</button>
    </form>
</div>

{% endblock %}
