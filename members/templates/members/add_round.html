{% extends 'members/base.html' %}
{% block content %}

<p class="page-title">おでかけを作成</p>
<p class="page-sub">日付・参加メンバー・運転手ごとの集合時刻を設定します</p>

<div class="card">
    <form method="POST" action="{% url 'add_round' %}">
        {% csrf_token %}
        <label for="day">日付</label>
        <input type="date" name="day" required>

        <label for="destination">目的地</label>
        <input type="text" name="destination" required>

        <label>参加メンバー</label>
        <div class="checkbox-row">
            {% for member in members %}
            <label><input type="checkbox" name="members" value="{{ member.id }}"> {{ member.name }}</label>
            {% endfor %}
        </div>

        <label>運転手ごとの集合時刻</label>
        <p class="page-sub">車を出す人だけ入力してください</p>
        {% for member in members %}
            {% if member.has_car %}
            <label for="meet_time_{{ member.id }}">{{ member.name }}（{{ member.nearest_station }}）</label>
            <input type="time" name="meet_time_{{ member.id }}">
            {% endif %}
        {% endfor %}

        <button type="submit" class="btn">作成する</button>
    </form>
</div>

{% endblock %}
